plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common:common-monitoring')
    implementation project(':common:common-web')
    implementation project(':common:common-jpa')
    implementation project(':common:common-messaging')

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // AWS S3
    implementation 'software.amazon.awssdk:s3:2.46.17'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Elasticsearch
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
}

//plain jar 생성 true
tasks.named('jar') {
    enabled = true
    archiveClassifier = 'plain'
}

tasks.named('bootJar') {
    archiveClassifier = ''
}

// 로컬 성능 측정 전용 태스크.
// 평소 bootRun은 main 클래스만 올려서 src/test의 측정 전용 API(PublishProductController)가 뜨지 않는다.
// 해당 태스크는 테스트 클래스만 클래스패스에 추가해 상품 상태 변경 API를 띄운다. bootJar에는 영향이 없다.
// (src/test/resources 의 application.yaml 이 main 설정을 가리지 않도록 resources 는 제외한다.)
tasks.register('bootRunBench', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = '측정 전용 API(src/test/.../PublishProductController)를 포함해 로컬에서만 기동한다.'
    dependsOn 'testClasses'
    mainClass = 'shop.dear.commerce.CommerceServiceApplication'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.output.classesDirs
}
